<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #17202a;
      --muted: #5f6f7d;
      --line: #d7dee5;
      --accent: #0f766e;
      --accent-2: #b42318;
      --surface: #f7f9fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #ffffff;
    }

    main {
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 54px;
    }

    .stage {
      position: relative;
      min-height: 0;
      display: block;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .panel {
      position: relative;
      min-width: 0;
      height: 100%;
      min-height: 0;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      left: 18px;
      top: 18px;
      max-width: min(430px, calc(100% - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .overlay strong {
      display: block;
      margin-bottom: 2px;
      font-size: 14px;
    }

    .overlay span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .formula-float {
      position: absolute;
      right: 18px;
      top: 18px;
      max-width: min(390px, calc(100% - 36px));
      padding: 12px 14px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease;
    }

    .formula-float code {
      display: block;
      color: var(--ink);
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: clamp(13px, 1.6vw, 18px);
      line-height: 1.45;
      white-space: pre-wrap;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #ffffff;
    }

    button {
      height: 34px;
      min-width: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    .timeline {
      flex: 1;
      min-width: 160px;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    input[type="range"] { width: 130px; }

    .axis { stroke: #26323c; stroke-width: 2; }
    .grid { stroke: #d8e0e7; stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .interval { stroke: var(--accent-2); stroke-width: 3; stroke-dasharray: 7 6; }
    .marker { fill: var(--accent-2); }
    .axis-label { fill: var(--ink); font-size: 13px; }
    .wire-axis { stroke: #26323c; stroke-width: 2; }
    .wire-rib { fill: none; stroke: rgba(15, 118, 110, 0.52); stroke-width: 1.4; }
    .wire-ring { fill: none; stroke: rgba(180, 35, 24, 0.45); stroke-width: 1.2; }

    @media (max-width: 760px) {
      main { grid-template-rows: minmax(0, 1fr) 96px; }
      footer { flex-wrap: wrap; align-content: center; }
      .timeline { min-width: 160px; }
      .formula-float { top: auto; right: 12px; bottom: 12px; max-width: calc(100% - 24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main data-simulation-id="{{ simulation_id }}">
    <section class="stage" aria-label="Interactive simulation stage">
      <div class="panel">
        <svg id="plot" viewBox="0 0 640 420" role="img" aria-label="2D curve and axes">
          <g id="grid"></g>
          <path id="x-axis" class="axis" d="M70 340H590"></path>
          <path id="y-axis" class="axis" d="M90 370V40"></path>
          <text id="x-label" class="axis-label" x="596" y="344">x</text>
          <text id="y-label" class="axis-label" x="80" y="34">y</text>
          <path id="interval" class="interval" d=""></path>
          <g id="surface-wireframe" aria-label="Projected 3D surface in the same axes"></g>
          <path id="curve" class="curve" d=""></path>
          <circle id="start-marker" class="marker" r="0"></circle>
          <circle id="end-marker" class="marker" r="0"></circle>
          <circle id="focus-marker" class="marker" r="0"></circle>
        </svg>
        <div class="overlay" id="plot-caption">
          <strong>{{ title }}</strong>
          <span>{{ first_caption }}</span>
        </div>
        <div class="formula-float" id="formula-panel">
          <code id="formula">{{ initial_formula }}</code>
        </div>
      </div>
    </section>
    <footer>
      <button id="prev" type="button" title="Previous scene">‹</button>
      <button id="play" type="button" title="Play or pause">▶</button>
      <button id="next" type="button" title="Next scene">›</button>
      <button id="replay" type="button" title="Replay">↻</button>
      <input id="timeline" class="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline">
      <label>a <input id="a-slider" type="range" min="{{ a_min }}" max="{{ a_max }}" step="{{ a_step }}" value="{{ a_value }}"></label>
      <label>speed <input id="speed-slider" type="range" min="0.5" max="2" step="0.25" value="1"></label>
    </footer>
  </main>

  <script type="application/json" id="simulation-data">{{ simulation_json }}</script>
  <script>
    try {
    const simulation = JSON.parse(document.getElementById("simulation-data").textContent);
    const scenes = simulation.scenes;
    const plot = document.getElementById("plot");
    const xAxis = document.getElementById("x-axis");
    const yAxis = document.getElementById("y-axis");
    const xLabel = document.getElementById("x-label");
    const yLabel = document.getElementById("y-label");
    const curve = document.getElementById("curve");
    const interval = document.getElementById("interval");
    const startMarker = document.getElementById("start-marker");
    const endMarker = document.getElementById("end-marker");
    const focusMarker = document.getElementById("focus-marker");
    const plotCaption = document.getElementById("plot-caption");
    const formula = document.getElementById("formula");
    const formulaPanel = document.getElementById("formula-panel");
    const timeline = document.getElementById("timeline");
    const aSlider = document.getElementById("a-slider");
    const speedSlider = document.getElementById("speed-slider");
    const playButton = document.getElementById("play");
    const wireframe = document.getElementById("surface-wireframe");

    const requestedScene = Number(new URLSearchParams(window.location.search).get("scene") || 0);
    let sceneIndex = Math.max(0, Math.min(scenes.length - 1, Number.isFinite(requestedScene) ? Math.floor(requestedScene) : 0));
    let sceneProgress = sceneIndex === 0 ? 0 : 1;
    let sceneStartedAt = performance.now();
    let playing = false;
    function f(x, a) {
      return x * Math.sqrt(x / a);
    }

    function toScreen(x, y, a) {
      const width = 500;
      const height = 300;
      const x0 = 90;
      const y0 = 340;
      return [x0 + (x / a) * width, y0 - (y / a) * height * 0.86];
    }

    function pointOnCurve(x, y, a, frontView) {
      const [baseX, baseY] = toScreen(x, y, a);
      const [frontX, frontY] = projectSurfacePoint(x, y, 0, a, 1);
      return [
        baseX + (frontX - baseX) * frontView,
        baseY + (frontY - baseY) * frontView,
      ];
    }

    function pathForCurve(a, progressRatio = 1, frontView = 0) {
      const clampedProgress = Math.max(0, Math.min(1, progressRatio));
      if (clampedProgress <= 0.001) return "";
      const steps = Math.max(8, Math.floor(120 * clampedProgress));
      const points = [];
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * clampedProgress;
        const x = a * t;
        const y = f(x, a);
        const [sx, sy] = pointOnCurve(x, y, a, frontView);
        points.push(`${i === 0 ? "M" : "L"}${sx.toFixed(2)} ${sy.toFixed(2)}`);
      }
      return points.join(" ");
    }

    function easeInOut(t) {
      const clamped = Math.max(0, Math.min(1, t));
      return clamped < 0.5
        ? 4 * clamped * clamped * clamped
        : 1 - Math.pow(-2 * clamped + 2, 3) / 2;
    }

    function setStrokeProgress(path, ratio) {
      const length = path.getTotalLength();
      const visible = Math.max(0, Math.min(1, ratio));
      path.style.strokeDasharray = `${length}`;
      path.style.strokeDashoffset = `${length * (1 - visible)}`;
    }

    function visualState(scene, easedProgress) {
      const cameraScene = sceneIndex === 5;
      const focusProgress = cameraScene ? Math.min(1, easedProgress * 1.7) : 0;
      const maxFrontView = 0.62;
      const frontView = sceneIndex < 5 ? 0 : sceneIndex === 5 ? easedProgress * maxFrontView : maxFrontView;
      return {
        axes: sceneIndex === 0 ? easedProgress : 1,
        curve: sceneIndex < 1 ? 0 : sceneIndex === 1 ? easedProgress : 1,
        interval: sceneIndex < 2 ? 0 : sceneIndex === 2 ? easedProgress : 1,
        theta: sceneIndex < 4 ? 0.01 : sceneIndex === 4 ? Math.PI * 2 * easedProgress : Math.PI * 2,
        cameraAngle: 0.35 + (0.9 - 0.35) * frontView,
        focusProgress,
        frontView,
      };
    }

    function update2d(a, state) {
      const fullView = { x: 0, y: 0, w: 640, h: 420 };
      const focusView = { x: 250, y: -86, w: 520, h: 520 };
      const view = {
        x: fullView.x + (focusView.x - fullView.x) * state.focusProgress,
        y: fullView.y + (focusView.y - fullView.y) * state.focusProgress,
        w: fullView.w + (focusView.w - fullView.w) * state.focusProgress,
        h: fullView.h + (focusView.h - fullView.h) * state.focusProgress,
      };
      plot.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
      const axisStart = pointOnCurve(0, 0, a, state.frontView);
      const axisEnd = pointOnCurve(a, 0, a, state.frontView);
      const verticalEnd = pointOnCurve(0, a, a, state.frontView);
      const [xLabelX, xLabelY] = pointOnCurve(a * 1.03, 0, a, state.frontView);
      const [yLabelX, yLabelY] = pointOnCurve(0, a * 1.04, a, state.frontView);

      xAxis.setAttribute("d", `M${axisStart[0]} ${axisStart[1]}L${xLabelX} ${xLabelY}`);
      yAxis.setAttribute("d", `M${axisStart[0]} ${axisStart[1]}L${verticalEnd[0]} ${verticalEnd[1]}`);
      xLabel.setAttribute("x", xLabelX + 6);
      xLabel.setAttribute("y", xLabelY + 4);
      yLabel.setAttribute("x", yLabelX - 10);
      yLabel.setAttribute("y", yLabelY - 6);
      xLabel.style.opacity = state.axes > 0.98 ? "1" : "0";
      yLabel.style.opacity = state.axes > 0.98 ? "1" : "0";
      setStrokeProgress(xAxis, state.axes);
      setStrokeProgress(yAxis, state.axes);
      curve.setAttribute("d", pathForCurve(a, state.curve, state.frontView));
      const [x0, y0] = axisStart;
      const [x1, y1] = axisEnd;
      const [xf, yf] = pointOnCurve(a, f(a, a), a, state.frontView);
      interval.setAttribute("d", `M${x0} ${y0}L${x1} ${y1}`);
      setStrokeProgress(interval, state.interval);
      startMarker.setAttribute("cx", x0);
      startMarker.setAttribute("cy", y0);
      startMarker.setAttribute("r", 5 * state.interval);
      endMarker.setAttribute("cx", x1);
      endMarker.setAttribute("cy", y1);
      endMarker.setAttribute("r", 5 * state.interval);
      focusMarker.setAttribute("cx", xf);
      focusMarker.setAttribute("cy", yf);
      focusMarker.setAttribute("r", 6 * state.focusProgress);
    }

    function projectSurfacePoint(x, y, z, a, frontView) {
      const [axisX, axisY] = toScreen(x, 0, a);
      const sideX = axisX + (y / a) * 38;
      const sideY = axisY - (z / a) * 258 - (y / a) * 22;
      const frontCenterX = 590;
      const frontCenterY = 340;
      const frontX = frontCenterX + (y / a) * 258 + (x / a - 1) * 18;
      const frontY = frontCenterY - (z / a) * 258 - (x / a - 1) * 10;
      const sx = sideX + (frontX - sideX) * frontView;
      const sy = sideY + (frontY - sideY) * frontView;
      return [sx, sy];
    }

    function wirePath(points) {
      return points.map((point, index) => `${index === 0 ? "M" : "L"}${point[0].toFixed(2)} ${point[1].toFixed(2)}`).join(" ");
    }

    function updateWireframe(a, thetaMax, frontView) {
      const parts = [];

      if (thetaMax < 0.05) {
        wireframe.innerHTML = parts.join("");
        return;
      }

      const ribCount = 10;
      const ringCount = 7;
      const xSteps = 44;
      const thetaSteps = 64;

      for (let rib = 0; rib <= ribCount; rib++) {
        const theta = (rib / ribCount) * thetaMax;
        const points = [];
        for (let i = 0; i <= xSteps; i++) {
          const x = (i / xSteps) * a;
          const radius = f(x, a);
          points.push(projectSurfacePoint(x, radius * Math.cos(theta), radius * Math.sin(theta), a, frontView));
        }
        parts.push(`<path class="wire-rib" d="${wirePath(points)}"></path>`);
      }

      for (let ring = 1; ring <= ringCount; ring++) {
        const x = (ring / ringCount) * a;
        const radius = f(x, a);
        const points = [];
        for (let j = 0; j <= thetaSteps; j++) {
          const theta = (j / thetaSteps) * thetaMax;
          points.push(projectSurfacePoint(x, radius * Math.cos(theta), radius * Math.sin(theta), a, frontView));
        }
        parts.push(`<path class="wire-ring" d="${wirePath(points)}"></path>`);
      }

      wireframe.innerHTML = parts.join("");
    }

    function updateSurface(a, state) {
      updateWireframe(a, state.theta, state.frontView);
    }

    function formulaForScene(scene) {
      if (scene.action === "draw_curve") return "f(x) = x sqrt(x / a)\\n0 <= x <= a";
      if (scene.action === "show_formula") return scene.formula || simulation.render.initialFormula;
      if (scene.action === "show_validation") return "checks:\\n- domain ok\\n- derivative ok\\n- parametrization ok";
      return "";
    }

    function formulaOpacityForScene(scene) {
      const hasFormula = formulaForScene(scene).length > 0;
      if (!hasFormula) return 0;
      if (sceneProgress < 0.12) return sceneProgress / 0.12;
      if (sceneProgress > 0.62) return Math.max(0, 1 - (sceneProgress - 0.62) / 0.28);
      return 1;
    }

    function renderScene() {
      const scene = scenes[sceneIndex];
      const a = Number(aSlider.value);
      const state = visualState(scene, easeInOut(sceneProgress));
      update2d(a, state);
      updateSurface(a, state);
      plotCaption.querySelector("strong").textContent = scene.goal;
      plotCaption.querySelector("span").textContent = scene.caption || "";
      formula.textContent = formulaForScene(scene);
      formulaPanel.style.opacity = String(formulaOpacityForScene(scene));
      timeline.value = String((sceneIndex + sceneProgress) / scenes.length);
    }

    function animate(now = performance.now()) {
      if (playing) {
        const duration = (scenes[sceneIndex].duration_ms || 1000) / Number(speedSlider.value);
        sceneProgress = Math.min(1, (now - sceneStartedAt) / duration);
        if (sceneProgress >= 1 && sceneIndex < scenes.length - 1) {
          sceneIndex += 1;
          sceneProgress = 0;
          sceneStartedAt = now;
        } else if (sceneProgress >= 1 && sceneIndex === scenes.length - 1) {
          playing = false;
          playButton.textContent = "▶";
        }
        renderScene();
      }
      requestAnimationFrame(animate);
    }

    function go(delta) {
      sceneIndex = Math.max(0, Math.min(scenes.length - 1, sceneIndex + delta));
      sceneProgress = delta > 0 ? 0 : 1;
      sceneStartedAt = performance.now();
      renderScene();
    }

    function setTimelineValue(value) {
      const raw = Math.max(0, Math.min(1, Number(value)));
      const scaled = raw * scenes.length;
      if (raw >= 1) {
        sceneIndex = scenes.length - 1;
        sceneProgress = 1;
      } else {
        sceneIndex = Math.max(0, Math.min(scenes.length - 1, Math.floor(scaled)));
        sceneProgress = scaled - sceneIndex;
      }
      sceneStartedAt = performance.now() - sceneProgress * ((scenes[sceneIndex].duration_ms || 1000) / Number(speedSlider.value));
      renderScene();
    }

    document.getElementById("prev").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    document.getElementById("replay").addEventListener("click", () => {
      sceneIndex = 0;
      sceneProgress = 0;
      sceneStartedAt = performance.now();
      renderScene();
    });
    playButton.addEventListener("click", () => {
      playing = !playing;
      playButton.textContent = playing ? "Ⅱ" : "▶";
      sceneStartedAt = performance.now() - sceneProgress * ((scenes[sceneIndex].duration_ms || 1000) / Number(speedSlider.value));
    });
    aSlider.addEventListener("input", renderScene);
    timeline.addEventListener("input", () => {
      playing = false;
      playButton.textContent = "▶";
      setTimelineValue(timeline.value);
    });
    speedSlider.addEventListener("input", () => {
      sceneStartedAt = performance.now() - sceneProgress * ((scenes[sceneIndex].duration_ms || 1000) / Number(speedSlider.value));
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") go(1);
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === " ") {
        event.preventDefault();
        playButton.click();
      }
    });
    renderScene();
    animate();
    } catch (error) {
      const caption = document.getElementById("plot-caption");
      if (caption) {
        caption.querySelector("strong").textContent = "Error de runtime";
        caption.querySelector("span").textContent = error.message;
      }
      throw error;
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #17202a;
      --muted: #5f6f7d;
      --line: #d7dee5;
      --accent: #0f766e;
      --accent-2: #b42318;
      --surface: #f7f9fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #ffffff;
    }

    main {
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto 54px;
    }

    .stage {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.1fr);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--line);
    }

    .panel:last-child { border-right: 0; }

    svg, #three-root {
      width: 100%;
      height: 100%;
      display: block;
    }

    #surface-wireframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: #ffffff;
    }

    .overlay {
      position: absolute;
      left: 18px;
      top: 18px;
      max-width: min(430px, calc(100% - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .overlay strong {
      display: block;
      margin-bottom: 2px;
      font-size: 14px;
    }

    .overlay span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .detail {
      min-height: 96px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .formula {
      margin: 0;
      font-family: "Cambria Math", Cambria, Georgia, serif;
      font-size: clamp(16px, 2.2vw, 24px);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .checks {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: right;
      max-width: 340px;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #ffffff;
    }

    button {
      height: 34px;
      min-width: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    .progress {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: #e8edf2;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 260ms ease;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    input[type="range"] { width: 130px; }

    .axis { stroke: #26323c; stroke-width: 2; }
    .grid { stroke: #d8e0e7; stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .interval { stroke: var(--accent-2); stroke-width: 3; stroke-dasharray: 7 6; }
    .marker { fill: var(--accent-2); }
    .axis-label { fill: var(--ink); font-size: 13px; }
    .wire-axis { stroke: #26323c; stroke-width: 2; }
    .wire-rib { fill: none; stroke: rgba(15, 118, 110, 0.52); stroke-width: 1.4; }
    .wire-ring { fill: none; stroke: rgba(180, 35, 24, 0.45); stroke-width: 1.2; }

    @media (max-width: 760px) {
      main { grid-template-rows: minmax(0, 1fr) auto 96px; }
      .stage { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
      .panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .detail { grid-template-columns: 1fr; gap: 6px; }
      .checks { text-align: left; max-width: none; }
      footer { flex-wrap: wrap; align-content: center; }
      .progress { min-width: 160px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main data-simulation-id="{{ simulation_id }}">
    <section class="stage" aria-label="Interactive simulation stage">
      <div class="panel">
        <svg id="plot" viewBox="0 0 640 420" role="img" aria-label="2D curve and axes">
          <g id="grid"></g>
          <path id="x-axis" class="axis" d="M70 340H590"></path>
          <path id="y-axis" class="axis" d="M90 370V40"></path>
          <text class="axis-label" x="596" y="344">x</text>
          <text class="axis-label" x="80" y="34">y</text>
          <path id="interval" class="interval" d=""></path>
          <path id="curve" class="curve" d=""></path>
          <circle id="start-marker" class="marker" r="0"></circle>
          <circle id="end-marker" class="marker" r="0"></circle>
        </svg>
        <div class="overlay" id="plot-caption">
          <strong>{{ title }}</strong>
          <span>{{ first_caption }}</span>
        </div>
      </div>
      <div class="panel">
        <div id="three-root" aria-label="3D surface of revolution"></div>
        <svg id="surface-wireframe" viewBox="0 0 640 420" role="img" aria-label="Projected 3D wireframe"></svg>
        <div class="overlay" id="three-caption">
          <strong>Vista 3D</strong>
          <span>La superficie se genera desde la parametrizacion validada.</span>
        </div>
      </div>
    </section>
    <section class="detail">
      <p class="formula" id="formula">{{ initial_formula }}</p>
      <p class="checks" id="checks">{{ check_summary }}</p>
    </section>
    <footer>
      <button id="prev" type="button" title="Previous scene">‹</button>
      <button id="play" type="button" title="Play or pause">▶</button>
      <button id="next" type="button" title="Next scene">›</button>
      <button id="replay" type="button" title="Replay">↻</button>
      <div class="progress" aria-label="Scene progress"><span id="progress"></span></div>
      <label>a <input id="a-slider" type="range" min="{{ a_min }}" max="{{ a_max }}" step="{{ a_step }}" value="{{ a_value }}"></label>
      <label>speed <input id="speed-slider" type="range" min="0.5" max="2" step="0.25" value="1"></label>
    </footer>
  </main>

  <script type="application/json" id="simulation-data">{{ simulation_json }}</script>
  <script type="module">
    import * as THREE from "../public/vendor/three/three.module.js";

    const simulation = JSON.parse(document.getElementById("simulation-data").textContent);
    const scenes = simulation.scenes;
    const plot = document.getElementById("plot");
    const curve = document.getElementById("curve");
    const interval = document.getElementById("interval");
    const startMarker = document.getElementById("start-marker");
    const endMarker = document.getElementById("end-marker");
    const plotCaption = document.getElementById("plot-caption");
    const formula = document.getElementById("formula");
    const progress = document.getElementById("progress");
    const aSlider = document.getElementById("a-slider");
    const speedSlider = document.getElementById("speed-slider");
    const playButton = document.getElementById("play");
    const checks = document.getElementById("checks");
    const wireframe = document.getElementById("surface-wireframe");

    const requestedScene = Number(new URLSearchParams(window.location.search).get("scene") || 0);
    let sceneIndex = Math.max(0, Math.min(scenes.length - 1, Number.isFinite(requestedScene) ? Math.floor(requestedScene) : 0));
    let playing = false;
    let timer = 0;
    let currentSurface = null;

    const root3d = document.getElementById("three-root");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    root3d.appendChild(renderer.domElement);

    const scene3d = new THREE.Scene();
    scene3d.background = new THREE.Color(0xf7f9fb);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    const light = new THREE.DirectionalLight(0xffffff, 2.5);
    light.position.set(3, 4, 5);
    scene3d.add(light);
    scene3d.add(new THREE.AmbientLight(0xffffff, 0.8));

    const axes = new THREE.Group();
    axes.add(line3d(new THREE.Vector3(0, 0, 0), new THREE.Vector3(4.5, 0, 0), 0x26323c));
    axes.add(line3d(new THREE.Vector3(0, -2.2, 0), new THREE.Vector3(0, 2.2, 0), 0x98a7b3));
    axes.add(line3d(new THREE.Vector3(0, 0, -2.2), new THREE.Vector3(0, 0, 2.2), 0x98a7b3));
    scene3d.add(axes);

    function line3d(a, b, color) {
      const geometry = new THREE.BufferGeometry().setFromPoints([a, b]);
      return new THREE.Line(geometry, new THREE.LineBasicMaterial({ color }));
    }

    function f(x, a) {
      return x * Math.sqrt(x / a);
    }

    function toScreen(x, y, a) {
      const width = 500;
      const height = 300;
      const x0 = 90;
      const y0 = 340;
      return [x0 + (x / a) * width, y0 - (y / a) * height * 0.86];
    }

    function pathForCurve(a, progressRatio = 1) {
      const steps = Math.max(8, Math.floor(120 * progressRatio));
      const points = [];
      for (let i = 0; i <= steps; i++) {
        const t = (i / 120) * progressRatio;
        const x = a * t;
        const y = f(x, a);
        const [sx, sy] = toScreen(x, y, a);
        points.push(`${i === 0 ? "M" : "L"}${sx.toFixed(2)} ${sy.toFixed(2)}`);
      }
      return points.join(" ");
    }

    function update2d(a, scene) {
      const curveProgress = scene.action === "draw_axes" ? 0 : scene.action === "draw_curve" ? 0.72 : 1;
      curve.setAttribute("d", pathForCurve(a, curveProgress));
      const [x0, y0] = toScreen(0, 0, a);
      const [x1, y1] = toScreen(a, 0, a);
      interval.setAttribute("d", scene.action === "highlight_interval" || sceneIndex >= 2 ? `M${x0} ${y0}L${x1} ${y1}` : "");
      startMarker.setAttribute("cx", x0);
      startMarker.setAttribute("cy", y0);
      startMarker.setAttribute("r", sceneIndex >= 2 ? 5 : 0);
      endMarker.setAttribute("cx", x1);
      endMarker.setAttribute("cy", y1);
      endMarker.setAttribute("r", sceneIndex >= 2 ? 5 : 0);
    }

    function buildSurface(a, thetaMax) {
      const radial = 48;
      const angular = 72;
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      const indices = [];

      for (let i = 0; i <= radial; i++) {
        const x = (i / radial) * a;
        const radius = f(x, a);
        for (let j = 0; j <= angular; j++) {
          const theta = (j / angular) * thetaMax;
          vertices.push(x, radius * Math.cos(theta), radius * Math.sin(theta));
        }
      }

      for (let i = 0; i < radial; i++) {
        for (let j = 0; j < angular; j++) {
          const row = angular + 1;
          const p = i * row + j;
          indices.push(p, p + row, p + 1);
          indices.push(p + 1, p + row, p + row + 1);
        }
      }

      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          color: 0x0f766e,
          metalness: 0,
          roughness: 0.48,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.78
        })
      );
    }

    function projectSurfacePoint(x, y, z, a) {
      const sx = 90 + (x / a) * 360 + y * 42;
      const sy = 300 - z * 58 - y * 20;
      return [sx, sy];
    }

    function wirePath(points) {
      return points.map((point, index) => `${index === 0 ? "M" : "L"}${point[0].toFixed(2)} ${point[1].toFixed(2)}`).join(" ");
    }

    function updateWireframe(a, thetaMax) {
      const parts = [];
      const [axisStartX, axisStartY] = projectSurfacePoint(0, 0, 0, a);
      const [axisEndX, axisEndY] = projectSurfacePoint(a, 0, 0, a);
      parts.push(`<path class="wire-axis" d="M${axisStartX} ${axisStartY}L${axisEndX} ${axisEndY}"></path>`);

      if (thetaMax < 0.05) {
        wireframe.innerHTML = parts.join("");
        return;
      }

      const ribCount = 10;
      const ringCount = 7;
      const xSteps = 44;
      const thetaSteps = 64;

      for (let rib = 0; rib <= ribCount; rib++) {
        const theta = (rib / ribCount) * thetaMax;
        const points = [];
        for (let i = 0; i <= xSteps; i++) {
          const x = (i / xSteps) * a;
          const radius = f(x, a);
          points.push(projectSurfacePoint(x, radius * Math.cos(theta), radius * Math.sin(theta), a));
        }
        parts.push(`<path class="wire-rib" d="${wirePath(points)}"></path>`);
      }

      for (let ring = 1; ring <= ringCount; ring++) {
        const x = (ring / ringCount) * a;
        const radius = f(x, a);
        const points = [];
        for (let j = 0; j <= thetaSteps; j++) {
          const theta = (j / thetaSteps) * thetaMax;
          points.push(projectSurfacePoint(x, radius * Math.cos(theta), radius * Math.sin(theta), a));
        }
        parts.push(`<path class="wire-ring" d="${wirePath(points)}"></path>`);
      }

      wireframe.innerHTML = parts.join("");
    }

    function update3d(a, scene) {
      if (currentSurface) {
        scene3d.remove(currentSurface);
        currentSurface.geometry.dispose();
        currentSurface.material.dispose();
      }
      const theta = scene.action === "rotate_curve_into_surface" ? Math.PI * 1.25 : sceneIndex >= 4 ? Math.PI * 2 : 0.01;
      currentSurface = buildSurface(a, theta);
      currentSurface.position.x = -a / 2;
      scene3d.add(currentSurface);

      const cameraAngle = scene.action === "move_camera" || sceneIndex >= 5 ? 0.9 : 0.35;
      camera.position.set(4.5 * Math.cos(cameraAngle), 2.6, 4.5 * Math.sin(cameraAngle));
      camera.lookAt(1, 0, 0);
      updateWireframe(a, theta);
    }

    function renderScene() {
      const scene = scenes[sceneIndex];
      const a = Number(aSlider.value);
      update2d(a, scene);
      update3d(a, scene);
      plotCaption.querySelector("strong").textContent = scene.goal;
      plotCaption.querySelector("span").textContent = scene.caption || "";
      formula.textContent = scene.formula || simulation.render.initialFormula;
      progress.style.width = `${((sceneIndex + 1) / scenes.length) * 100}%`;
    }

    function resize() {
      const rect = root3d.getBoundingClientRect();
      renderer.setSize(Math.max(1, rect.width), Math.max(1, rect.height), false);
      camera.aspect = Math.max(1, rect.width) / Math.max(1, rect.height);
      camera.updateProjectionMatrix();
    }

    function animate() {
      resize();
      renderer.render(scene3d, camera);
      requestAnimationFrame(animate);
    }

    function go(delta) {
      sceneIndex = Math.max(0, Math.min(scenes.length - 1, sceneIndex + delta));
      renderScene();
    }

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;
      const duration = (scenes[sceneIndex].duration_ms || 1000) / Number(speedSlider.value);
      timer = setTimeout(() => {
        if (sceneIndex === scenes.length - 1) {
          playing = false;
          playButton.textContent = "▶";
          return;
        }
        go(1);
        schedule();
      }, duration);
    }

    document.getElementById("prev").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    document.getElementById("replay").addEventListener("click", () => {
      sceneIndex = 0;
      renderScene();
      if (playing) schedule();
    });
    playButton.addEventListener("click", () => {
      playing = !playing;
      playButton.textContent = playing ? "Ⅱ" : "▶";
      schedule();
    });
    aSlider.addEventListener("input", renderScene);
    speedSlider.addEventListener("input", schedule);
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") go(1);
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === " ") {
        event.preventDefault();
        playButton.click();
      }
    });
    window.addEventListener("resize", resize);

    checks.textContent = simulation.render.checkSummary;
    renderScene();
    animate();
  </script>
</body>
</html>
